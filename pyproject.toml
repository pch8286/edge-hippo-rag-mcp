[project]
name = "seahorse-rag-mcp"
version = "0.1.0"
description = "Seahorse RAG MCP: lightweight edge-optimized personal GraphRAG memory server"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
    "fastmcp>=0.1.0",
    "gliner>=0.2.0",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
    "python-igraph>=0.11.0",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "sqlite-vec>=0.1.0",
    "tokenizers>=0.15.0",
    "onnxruntime>=1.15.0",
    "optimum>=1.13.0",
    "psutil>=5.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "black>=24.0.0"
]

[project.urls]
Homepage = "https://github.com/pch8286/seahorse-rag-mcp"
Repository = "https://github.com/pch8286/seahorse-rag-mcp"
Issues = "https://github.com/pch8286/seahorse-rag-mcp/issues"

[project.scripts]
seahorse = "seahorse.cli:main"
seahorse-server = "seahorse.server:main"
pam = "seahorse.cli:main"
pam-server = "seahorse.server:main"
hippo = "seahorse.cli:main"
edge-hippo-server = "seahorse.server:main"

[tool.setuptools.packages.find]
# Ship the preferred seahorse namespace while keeping legacy imports working.
include = ["seahorse*", "edge_hippo*", "memory_crud*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
